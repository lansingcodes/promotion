# Copy to events/YYYY-MM-DD-speaker-slug.yml, fill in the organizer section,
# then run: /draft-event events/<file>.yml
# Files starting with "_" are ignored by every script.

# --- Organizer input ---
date: 2026-01-01              # YYYY-MM-DD
start_time: "18:00"           # 24-hour, quoted
end_time: "20:00"
title: ""                     # as the speaker sent it
speaker:
  name: ""
  title: ""                   # leave "" if unknown, never guess
  company: ""                 # leave "" if unknown
  photo_url: ""               # direct image URL, or ""
  bio_raw: |
description_raw: |
venue:
  name: ""
  address: ""
  notes: ""                   # optional: food, drinks, parking
registration_link: ""         # Meetup, Eventbrite, or any URL

# --- Generated by /draft-event (organizer reviews) ---
generated:
  title: ""
  hook: ""
  description_long: ""
  speaker_bio_short: ""
  captions:
    announce: ""
    week_before: ""
    day_before: ""
    day_of: ""
  email_blurb: ""
  gaps: []
status: draft                 # draft | approved | published
