    Get Lit Lansing (previously Demo Camp Lansing) is an interactive fair. Presenters set up a table, and you walk the room, mingle, and talk directly with the people behind each project. There are up to 40 demo stations, plus short talks of 5–7 minutes and a block of 3–5 minute lightning talks. No pitch contest.

    It's open to all skill levels and backgrounds: MSU students and faculty, Burgess Institute, MSU Technology, SmartZone, local tech groups, local businesses, startups, game developers, robotics clubs, and anyone building something in Lansing. It's free.

    **Get a ticket:** https://luma.com/nsgv3u1y

    **Want a table or a talk slot?** Sign up to present: https://forms.gle/3aE34iejLinmuGDcA

    **Schedule**

    - 4:30 PM – Doors open and presenters set up their tables
    - Early evening – Demo floor opens
    - Mid-evening – Short talks, with time to mingle between blocks
    - Later – Lightning talks, closing remarks and a group photo
    - About 9:00 PM – Wrap-up

    Dinner is included: subs, chips, cookies, and drinks.

    Get Lit Lansing is part of the Lansing Codes community. Thanks to our sponsors MSU Federal Credit Union, MSU Research Foundation, Lansing Regional SmartZone, and RMC, and to the Lansing Economic Area Partnership for its support.

    ---

    Lansing Codes is a nonprofit community for developers, coding enthusiasts, and anyone curious about tech in Greater Lansing. We host a free meetup every month, keep a calendar of every local tech event at lansing.codes, and hang out on Slack at slack.lansing.codes. All events follow our Code of Conduct: https://www.lansing.codes/code-of-conduct
