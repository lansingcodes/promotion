description_raw: |
  From getlitlansing.org:
  Get Lit Lansing (previously Demo Camp Lansing). Mid-Michigan's community tech showcase. Cool people, doing cool sh*t.
  Come see what your neighbors are building — startups, company work, student research, weekend projects.
  An interactive fair: presenters set up a table, and you walk the room, mingle, and talk directly with the people behind each project. Up to 40 demo stations, plus optional 5–7 minute talks and a lightning talk block (3–5 minutes each). Demo tables, short talks, no pitch contest.
  Schedule: 4:30 PM doors open and presenters set up their tables. Early evening, the demo floor opens. Mid-evening, a block of short talks, with time for mingling between blocks. Later, a lightning talk block, then closing remarks and a group photo. Wraps around 9:00 PM.
  Open to all skill levels and backgrounds: MSU students and faculty, Burgess Institute, MSU Technology, SmartZone, local tech groups, local businesses, startups, game developers, robotics clubs, and anyone building something in Lansing.
  Part of the Lansing Codes community. Sponsors: MSU Federal Credit Union, MSU Research Foundation, Lansing Regional SmartZone, and RMC, with support from the Lansing Economic Area Partnership.
  Free. Tickets: https://luma.com/nsgv3u1y
  Want to present? Sign up: https://forms.gle/3aE34iejLinmuGDcA
